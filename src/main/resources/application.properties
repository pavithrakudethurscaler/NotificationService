spring.application.name=notificationservice
server.port=8086

# In-memory H2 by default so the app runs out of the box.
# Use --spring.profiles.active=mysql for MySQL (see application-mysql.properties).
spring.datasource.url=jdbc:h2:mem:notificationservice
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# User Service: token validation for /api/v1/notifications, and email lookup for Order/Payment events
userservice.base-url=${USERSERVICE_URL:http://localhost:8082}

# Shared secret for /internal/** (events from User, Order and Payment Services). Rejected until set. Never commit.
internal.api-token=${INTERNAL_API_TOKEN:}

# Email delivery: "log" (development, writes emails to the log) or "smtp" (real email, e.g. Amazon SES SMTP)
notification.email.sender=${EMAIL_SENDER:log}
notification.email.from=${EMAIL_FROM:no-reply@ecom.local}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# Retry of failed deliveries
notification.retry.max-attempts=5
notification.retry.interval-ms=${NOTIFICATION_RETRY_INTERVAL_MS:60000}
